# Maintainer coverage audit; intentionally not rendered on the deadline page.
# CSRankings defines venue membership, not submission dates. CFPs own the dates.
# A missing timeline row must have a status and owning source here.
checked: "2026-10-31"
venue_list_source: https://csrankings.org/
scope: All CSRankings Systems areas, AI, machine learning, vision, CS education, and logic/verification
status_definitions:
  included: A verified upcoming main-paper submission round is in the timeline.
  latest_cycle_closed: The latest verified main-paper cycle has passed; no confirmed next-cycle date was found.
  no_confirmed_date: The checked owning source does not publish a usable future paper date.
  verification_pending: An authoritative future CFP could not be retrieved or verified; do not treat this as proof of no announcement.
  conflicting_sources: Official pages disagree; the date needs clarification before publication.
  series_transition: The ranked series has changed organizers or ended; track its successor separately.
  no_2027_edition: The official series does not run in 2027.
